# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
# gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
# nixpkgs = "nixpkgs"
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.claude-code]
url = "github:sadjow/claude-code-nix"

[inputs.claude-code.follows]
nixpkgs = "nixpkgs"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.hjem]
url = "github:feel-co/hjem"

[inputs.hjem.follows]
nixpkgs = "nixpkgs"

[inputs.jiaoshijie-undotree]
url = "github:jiaoshijie/undotree"
type = "fetch"

[inputs.jjsigns-nvim]
url = "github:shaver/jjsigns.nvim"
type = "fetch"

[inputs.moonshine]
url = "github:hgaiser/moonshine"

[inputs.nix-darwin]
url = "github:nix-darwin/nix-darwin/master"

[inputs.nix-darwin.follows]
nixpkgs = "nixpkgs"

[inputs.nix-gaming]
url = "github:fufexan/nix-gaming"

[inputs.nix-gaming.follows]
flake-parts = "flake-parts"
nixpkgs = "nixpkgs"

[inputs.nixpkgs]
url = "https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz"

[inputs.noctalia]
# guarantee a cache hit because compiling is for chumps
# (no nixpkgs follows, so the binary cache matches)
url = "github:noctalia-dev/noctalia/cachix"

[inputs.nvf]
url = "github:notashelf/nvf"

[inputs.nvf.follows]
nixpkgs = "nixpkgs"

[inputs.pi]
url = "github:lukasl-dev/pi.nix"

[inputs.proton-cachyos]
url = "github:powerofthe69/proton-cachyos-nix"

[inputs.proton-cachyos.follows]
nixpkgs = "nixpkgs"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"

[inputs.sops-nix.follows]
nixpkgs = "nixpkgs"

[inputs.tmux-status-nvim]
url = "github:christopher-francisco/tmux-status.nvim"
type = "fetch"

[inputs.umbriel]
url = "github:noctalia-dev/umbriel"

[inputs.umbriel.follows]
nixpkgs = "nixpkgs"

[inputs.xivlauncher-rb]
url = "github:shaver/nixos-xivlauncher-rb"

[inputs.xivlauncher-rb.follows]
nixpkgs = "nixpkgs"
